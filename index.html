<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresh Fruit Shop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo">🍎 Fresh Fruit Shop</div>
      <div class="cart">🛒 Cart: <span id="cart-count">0</span></div>
    </header>

    <section class="hero">
      <h1>Fresh & Healthy Fruits</h1>
      <p>Get farm-fresh fruits delivered to your doorstep.</p>
      <button>Shop Now</button>
    </section>

    <section class="products">
      <h2>Our Fruits</h2>

      <div class="product-grid">
        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?w=400"
            alt="Apple"
          />
          <h3>Apple</h3>
          <p>$2.99 / kg</p>
          <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1574226516831-e1dff420e37f?w=400"
            alt="Banana"
          />
          <h3>Banana</h3>
          <p>$1.49 / dozen</p>
          <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1557800636-894a64c1696f?w=400"
            alt="Orange"
          />
          <h3>Orange</h3>
          <p>$2.49 / kg</p>
          <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1619566636858-adf3ef46400b?w=400"
            alt="Watermelon"
          />
          <h3>Watermelon</h3>
          <p>$4.99 each</p>
          <button onclick="addToCart()">Add to Cart</button>
        </div>
      </div>
    </section>

    <footer>
      <p>&copy; 2026 Fresh Fruit Shop. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
